services:
  - type: web
    name: sairam-technologies
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
      - key: WEB3FORMS_ACCESS_KEY
        sync: false
